<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Dinner Planner</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Firebase SDKs (v8 compatibility) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --available-bg: #27ae60;
            --busy-bg: #e74c3c;
            --gap-bg: #fff3cd;
            --gap-border: #ffeba2;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: var(--primary-color);
            margin-top: 0;
            font-size: 24px;
        }

        .status-bar {
            padding: 6px 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
        }

        .status-syncing { background: #e2e3e5; color: #383d41; }
        .status-online { background: #d4edda; color: #155724; }
        .status-error { background: #f8d7da; color: #721c24; }

        /* Controls Panel */
        .controls-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            background: #eef2f5;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .add-member-form {
            display: flex;
            gap: 10px;
        }

        input[type="text"], select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        select {
            font-weight: bold;
            background-color: #fff;
            cursor: pointer;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-add { background-color: #27ae60; color: white; }
        .btn-add:hover { background-color: #219150; }

        .btn-remove { 
            background-color: transparent; 
            color: #e74c3c; 
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-left: 5px;
        }
        .btn-remove:hover { color: #c0392b; }

        /* Gaps Box */
        .gaps-box {
            background-color: var(--gap-bg);
            border: 1px solid var(--gap-border);
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .gaps-box h3 { margin-top: 0; color: #856404; font-size: 16px; }

        .gap-list { display: flex; flex-wrap: wrap; gap: 8px; }

        .gap-badge {
            background: #fff;
            border: 1px solid #ffe8a1;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 13px;
            color: #856404;
        }

        /* Day Selector Navigation Tabs */
        .day-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .day-tab {
            padding: 8px 16px;
            background: #e9ecef;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            user-select: none;
        }

        .day-tab.active {
            background: var(--primary-color);
            color: white;
        }

        /* Optimized Grid Layout */
        .grid-container { overflow-x: auto; }

        table.calendar-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        table.calendar-table th, table.calendar-table td {
            border: 1px solid #dee2e6;
            padding: 8px;
        }

        table.calendar-table th {
            background-color: var(--primary-color);
            color: white;
            font-size: 13px;
        }

        .member-name-td {
            text-align: left;
            font-weight: bold;
            min-width: 140px;
            background-color: #f8f9fa;
        }

        /* Slot Buttons */
        .slot-btn {
            height: 38px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            transition: transform 0.1s, opacity 0.2s;
            user-select: none;
        }

        .slot-btn:active { transform: scale(0.95); }

        .slot-available { background-color: var(--available-bg); }
        .slot-busy { background-color: var(--busy-bg); }

        /* Legend Footer */
        .legend {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-box { width: 16px; height: 16px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍽️ Family Dinner Planner</h1>
    <div id="syncStatus" class="status-bar status-syncing">🔄 Connecting...</div>

    <!-- Controls -->
    <div class="controls-panel">
        <div class="add-member-form">
            <input type="text" id="memberNameInput" placeholder="New member name...">
            <button class="btn-add" id="btnAddMember">Add Member</button>
        </div>
        <div class="legend">
            <div class="legend-item">
                <div class="legend-box" style="background: var(--available-bg);"></div> Free (Click to toggle)
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: var(--busy-bg);"></div> Busy
            </div>
        </div>
    </div>

    <!-- Dinner Opportunities -->
    <div class="gaps-box">
        <h3>🎉 Common Free Slots (Everyone Free)</h3>
        <div id="commonGapsContainer" class="gap-list">
            <em>Calculating open slots...</em>
        </div>
    </div>

    <!-- Day Navigation Tabs -->
    <div class="day-tabs" id="dayTabs">
        <!-- Dynamic Day Tabs -->
    </div>

    <!-- Clean Schedule Table -->
    <div class="grid-container">
        <table class="calendar-table">
            <thead>
                <tr id="tableHeaderRow">
                    <th style="width: 150px;">Member</th>
                    <!-- Hour Headers will render here -->
                </tr>
            </thead>
            <tbody id="calendarBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    // 1. FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyAfAzvGEKnH6E8c-CUC5cPQjrpXNJEgjOM",
        authDomain: "family-dinner-planner-8f1c0.firebaseapp.com",
        databaseURL: "https://family-dinner-planner-8f1c0-default-rtdb.firebaseio.com",
        projectId: "family-dinner-planner-8f1c0",
        storageBucket: "family-dinner-planner-8f1c0.firebasestorage.app",
        messagingSenderId: "412815867230",
        appId: "1:412815867230:web:cbd10ce320bdebb30423cf",
        measurementId: "G-E33V8W04K8"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const hours = [
        '04:00 PM', '05:00 PM', '06:00 PM', '07:00 PM', 
        '08:00 PM', '09:00 PM', '10:00 PM', '11:00 PM'
    ];

    let familyData = [];
    let selectedDay = 'Monday';

    $(document).ready(function() {

        // Render Day Tabs
        days.forEach(day => {
            $('#dayTabs').append(`
                <div class="day-tab ${day === selectedDay ? 'active' : ''}" data-day="${day}">
                    ${day}
                </div>
            `);
        });

        // Tab click event
        $(document).on('click', '.day-tab', function() {
            $('.day-tab').removeClass('active');
            $(this).addClass('active');
            selectedDay = $(this).data('day');
            renderApp();
        });

        // Realtime Listener
        db.ref('familyData').on('value', (snapshot) => {
            familyData = snapshot.val() || [];
            
            $('#syncStatus')
                .removeClass('status-syncing status-error')
                .addClass('status-online')
                .html('🟢 Live Sync Active');

            renderApp();
        }, (error) => {
            console.error(error);
            $('#syncStatus')
                .removeClass('status-syncing')
                .addClass('status-error')
                .html('❌ Database Access Denied.');
        });

        function saveDataToCloud() {
            db.ref('familyData').set(familyData);
        }

        function initMemberAvailability(member) {
            if (!member.availability) member.availability = {};
            days.forEach(day => {
                if (!member.availability[day]) member.availability[day] = {};
                hours.forEach(hour => {
                    if (member.availability[day][hour] === undefined) {
                        member.availability[day][hour] = true;
                    }
                });
            });
        }

        function renderApp() {
            familyData.forEach(member => initMemberAvailability(member));

            // Render Time Header
            const $headerRow = $('#tableHeaderRow');
            $headerRow.find('th:gt(0)').remove();
            
            hours.forEach(hour => {
                $headerRow.append(`<th>${hour.replace(':00', '')}</th>`);
            });

            // Render Member Rows for Selected Day
            const $calendarBody = $('#calendarBody');
            $calendarBody.empty();

            if (familyData.length === 0) {
                $calendarBody.append(`<tr><td colspan="${hours.length + 1}"><em>No family members added yet.</em></td></tr>`);
            } else {
                familyData.forEach(member => {
                    let rowHtml = `<tr>
                        <td class="member-name-td">
                            ${escapeHtml(member.name)}
                            <button class="btn-remove" data-id="${member.id}" title="Remove Member">✕</button>
                        </td>`;

                    hours.forEach(hour => {
                        const isAvailable = member.availability[selectedDay][hour];
                        const slotClass = isAvailable ? 'slot-available' : 'slot-busy';
                        const text = isAvailable ? 'Free' : 'Busy';

                        rowHtml += `
                            <td>
                                <div class="slot-btn ${slotClass}" 
                                     data-member-id="${member.id}" 
                                     data-day="${selectedDay}" 
                                     data-hour="${hour}">
                                    ${text}
                                </div>
                            </td>
                        `;
                    });

                    rowHtml += `</tr>`;
                    $calendarBody.append(rowHtml);
                });
            }

            calculateGaps();
        }

        function calculateGaps() {
            const $container = $('#commonGapsContainer');
            $container.empty();

            if (familyData.length === 0) {
                $container.html('<em>Add family members to see matching dinner times.</em>');
                return;
            }

            let gapsFound = 0;

            days.forEach(day => {
                hours.forEach(hour => {
                    const allAvailable = familyData.every(member => member.availability[day][hour] === true);

                    if (allAvailable) {
                        gapsFound++;
                        $container.append(`
                            <div class="gap-badge">
                                📍 ${day} @ ${hour}
                            </div>
                        `);
                    }
                });
            });

            if (gapsFound === 0) {
                $container.html('<em>No common free slots found where everyone is available.</em>');
            }
        }

        // Toggle slot state
        $(document).on('click', '.slot-btn', function() {
            const memberId = $(this).data('member-id').toString();
            const day = $(this).data('day');
            const hour = $(this).data('hour');

            const member = familyData.find(m => m.id === memberId);
            if (member) {
                member.availability[day][hour] = !member.availability[day][hour];
                saveDataToCloud();
            }
        });

        // Add Member
        $('#btnAddMember').on('click', function() {
            const name = $('#memberNameInput').val().trim();
            if (!name) return alert('Enter a name');

            familyData.push({
                id: Date.now().toString(),
                name: name,
                availability: {}
            });

            saveDataToCloud();
            $('#memberNameInput').val('');
        });

        // Remove Member
        $(document).on('click', '.btn-remove', function() {
            const memberId = $(this).data('id').toString();
            if (confirm('Remove this person from calendar?')) {
                familyData = familyData.filter(m => m.id !== memberId);
                saveDataToCloud();
            }
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    });
</script>

</body>
</html>
